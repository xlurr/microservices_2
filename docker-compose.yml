version: "3.8"

services:
  # ========== DATABASES ==========
  
  users-db:
    image: postgres:15-alpine
    container_name: users-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    volumes:
      - users_data:/var/lib/postgresql/data
      - ./init-scripts/001-users-init.sql:/docker-entrypoint-initdb.d/001-init.sql
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    volumes:
      - orders_data:/var/lib/postgresql/data
      - ./init-scripts/002-orders-init.sql:/docker-entrypoint-initdb.d/002-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  payments-db:
    image: postgres:15-alpine
    container_name: payments-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    volumes:
      - payments_data:/var/lib/postgresql/data
      - ./init-scripts/003-payments-init.sql:/docker-entrypoint-initdb.d/003-init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  delivery-db:
    image: postgres:15-alpine
    container_name: delivery-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery_db
    volumes:
      - delivery_data:/var/lib/postgresql/data
      - ./init-scripts/004-deliveries-init.sql:/docker-entrypoint-initdb.d/004-init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ========== MICROSERVICES ==========

  users-service:
    build: ./users-service
    container_name: users-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@users-db:5432/users_db?sslmode=disable
      GATEWAY_URL: http://api-gateway
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - microservices-network

  orders-service-1:
    build: ./orders-service
    container_name: orders-service-1
    environment:
      DATABASE_URL: postgres://postgres:postgres@orders-db:5432/orders_db?sslmode=disable
      PORT: 8002
      REPLICA_ID: instance-1
    ports:
      - "8002:8002"
    depends_on:
      orders-db:
        condition: service_healthy
    networks:
      - microservices-network

  orders-service-2:
    build: ./orders-service
    container_name: orders-service-2
    environment:
      DATABASE_URL: postgres://postgres:postgres@orders-db:5432/orders_db?sslmode=disable
      PORT: 8002
      REPLICA_ID: instance-2
    ports:
      - "8003:8002"
    depends_on:
      orders-db:
        condition: service_healthy
    networks:
      - microservices-network

  payments-service:
    build: ./payments-service
    container_name: payments-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@payments-db:5432/payments_db?sslmode=disable
      GATEWAY_URL: http://api-gateway
      PORT: 8003
    ports:
      - "8004:8003"
    depends_on:
      payments-db:
        condition: service_healthy
    networks:
      - microservices-network

  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@delivery-db:5432/delivery_db?sslmode=disable
      GATEWAY_URL: http://api-gateway
      PORT: 8004
    ports:
      - "8005:8004"
    depends_on:
      delivery-db:
        condition: service_healthy
    networks:
      - microservices-network

  # ========== API GATEWAY ==========

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    depends_on:
      users-service:
        condition: service_started
      orders-service-1:
        condition: service_started
      orders-service-2:
        condition: service_started
      payments-service:
        condition: service_started
      delivery-service:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - microservices-network

  # ========== PGADMIN ==========

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - users-db
      - orders-db
      - payments-db
      - delivery-db
    networks:
      - microservices-network

volumes:
  users_data:
  orders_data:
  payments_data:
  delivery_data:

networks:
  microservices-network:
    driver: bridge
